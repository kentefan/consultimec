<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos | CONSULTIMEC</title>
  <meta name="description" content="Proyectos industriales realizados por CONSULTIMEC.">
  <link rel="icon" href="assets/site/cropped-ISO_Mesa-de-trabajo-1-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="índice.html" aria-label="CONSULTIMEC inicio">
      <img src="assets/site/LOGO-CONSULTIMEC.svg" alt="CONSULTIMEC">
    </a>

    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="main-menu" class="main-menu" aria-label="Menú principal">
      <a href="índice.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="servicios.html">Servicios</a>
      <a class="active" href="proyectos.html">Proyectos</a>
      <a href="clientes.html">Clientes</a>
      <a href="contacto.html">Contáctenos</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Proyectos realizados por CONSULTIMEC">
      <img src="assets/site/BANNER-1-CONSULTIMEC_Mesa-de-trabajo-1-min.png" alt="Proyectos industriales de CONSULTIMEC">
    </section>

    <section class="section projects-section">
      <div class="section-heading">
        <span class="eyebrow">Obras recientes</span>
        <h1>Proyectos realizados</h1>
        <p>Selecciona un proyecto para revisar su galería completa de fotografías.</p>
      </div>

      <div class="projects-grid">
        <button class="project-card" type="button" data-project="0">
          <img src="assets/projects/proyecto-escalera-inclinada-para-acceso-de-limpieza-songa/08.jpg" alt="Proyecto Escalera inclinada para acceso de Limpieza - Songa">
          <span>12 fotos</span>
          <strong>Proyecto Escalera inclinada para acceso de Limpieza - Songa</strong>
        </button>

        <button class="project-card" type="button" data-project="1">
          <img src="assets/projects/proyecto-proteccion-de-pantallas-songa/05.jpg" alt="Proyecto protección de Pantallas - Songa">
          <span>6 fotos</span>
          <strong>Proyecto protección de Pantallas - Songa</strong>
        </button>

        <button class="project-card" type="button" data-project="2">
          <img src="assets/projects/proyecto-tanque-santa-elena/10.jpg" alt="Proyecto Tanque Santa Elena">
          <span>11 fotos</span>
          <strong>Proyecto Tanque Santa Elena</strong>
        </button>
      </div>
    </section>

    <section class="section portfolio-section">
      <div class="section-heading">
        <span class="eyebrow">Portafolio</span>
        <h2>Portafolio de productos</h2>
      </div>

      <div class="portfolio-grid">
        <img src="assets/site/PORTAFOLIO-1.png" alt="Portafolio de productos CONSULTIMEC 1">
        <img src="assets/site/PORTAFOLIO-2.png" alt="Portafolio de productos CONSULTIMEC 2">
        <img src="assets/site/PORTAFOLIO-3.png" alt="Portafolio de productos CONSULTIMEC 3">
        <img src="assets/site/PORTAFOLIO-4.png" alt="Portafolio de productos CONSULTIMEC 4">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Diseñado para CONSULTIMEC CIA. LTDA.</p>
  </footer>

  <a class="whatsapp" href="https://wa.me/" aria-label="Contactar por WhatsApp">WA</a>

  <dialog class="gallery-dialog" aria-label="Galería de proyecto">
    <button class="dialog-close" type="button" aria-label="Cerrar galería">Cerrar</button>

    <div class="dialog-body">
      <div class="gallery-main">
        <button class="gallery-nav prev" type="button" aria-label="Foto anterior">Anterior</button>
        <img id="gallery-image" src="" alt="">
        <button class="gallery-nav next" type="button" aria-label="Foto siguiente">Siguiente</button>
      </div>

      <div class="gallery-info">
        <h2 id="gallery-title"></h2>
        <p id="gallery-count"></p>
        <div id="gallery-thumbs" class="gallery-thumbs"></div>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
