<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Clientes | CONSULTIMEC</title>

  <meta
    name="description"
    content="Clientes publicados de CONSULTIMEC."
  >

  <link
    rel="icon"
    href="/consultimec/assets/site/cropped-ISO_Mesa-de-trabajo-1-32x32.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/consultimec/styles.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <!-- LOGO -->
    <a
      class="brand"
      href="/consultimec/index.html"
      aria-label="CONSULTIMEC inicio"
    >
      <img
        src="/consultimec/assets/site/LOGO-CONSULTIMEC.svg"
        alt="CONSULTIMEC"
      >
    </a>


    <!-- MENÚ MÓVIL -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menú"
      aria-expanded="false"
      aria-controls="main-menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>


    <!-- MENÚ PRINCIPAL -->
    <nav
      id="main-menu"
      class="main-menu"
      aria-label="Menú principal"
    >

      <a href="/consultimec/index.html">
        Inicio
      </a>

      <a href="/consultimec/nosotros.html">
        Nosotros
      </a>

      <a href="/consultimec/servicios.html">
        Servicios
      </a>

      <a href="/consultimec/proyectos.html">
        Proyectos
      </a>

      <a
        class="active"
        href="/consultimec/clientes.html"
      >
        Clientes
      </a>

      <a href="/consultimec/contacto.html">
        Contáctenos
      </a>

    </nav>

  </header>


  <!-- CONTENIDO -->
  <main>

    <!-- BANNER -->
    <section
      class="hero"
      aria-label="Clientes de CONSULTIMEC"
    >

      <img
        src="/consultimec/assets/site/BANNER-1-CONSULTIMEC_Mesa-de-trabajo-1-min.png"
        alt="CONSULTIMEC"
      >

    </section>


    <!-- CLIENTES -->
    <section class="section clients-section">

      <div class="section-heading">

        <span class="eyebrow">
          Experiencia industrial
        </span>

        <h1>
          Nuestros clientes
        </h1>

        <p>
          Empresas incluidas en el sitio publicado de CONSULTIMEC.
        </p>

      </div>


      <!-- LOGOS -->
      <div class="client-logos">

        <img
          src="/consultimec/assets/site/LOGO-CN_Mesa-de-trabajo-1.png"
          alt="Cervecería Nacional"
        >

        <img
          src="/consultimec/assets/site/NIRSA_Mesa-de-trabajo-1.png"
          alt="NIRSA"
        >

        <img
          src="/consultimec/assets/site/SM_Mesa-de-trabajo-1.png"
          alt="SMI"
        >

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <p>
      Diseñado para CONSULTIMEC CIA. LTDA.
    </p>

  </footer>


  <!-- WHATSAPP -->
  <a
    class="whatsapp"
    href="https://wa.me/"
    aria-label="Contactar por WhatsApp"
  >
    WA
  </a>


  <!-- JAVASCRIPT -->
  <script>

    const menuToggle = document.querySelector(".menu-toggle");
    const mainMenu = document.querySelector(".main-menu");

    menuToggle.addEventListener("click", () => {

      const isOpen = mainMenu.classList.toggle("open");

      menuToggle.setAttribute(
        "aria-expanded",
        String(isOpen)
      );

    });


    // Cerrar menú móvil al seleccionar una página

    mainMenu.querySelectorAll("a").forEach((link) => {

      link.addEventListener("click", () => {

        mainMenu.classList.remove("open");

        menuToggle.setAttribute(
          "aria-expanded",
          "false"
        );

      });

    });

  </script>

</body>

</html>
